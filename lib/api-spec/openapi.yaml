openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the Cash Game Lobby prototype.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Player account and session operations
  - name: lobby
    description: Game lobby and real-player matchmaking
  - name: wallet
    description: Manual deposit and withdrawal requests
  - name: admin
    description: Operations review and system configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current player session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid signup data
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in to a player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /lobby:
    get:
      operationId: getLobby
      tags: [lobby]
      summary: Get the unified wallet, games, room options, and account activity
      responses:
        "200":
          description: Lobby data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyResponse"
        "401":
          description: Sign in required
  /rooms/join:
    post:
      operationId: joinRoom
      tags: [lobby]
      summary: Join or create a real-player matchmaking queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinInput"
      responses:
        "200":
          description: Joined an existing queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "201":
          description: Created a queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid room choice or insufficient total money
        "401":
          description: Sign in required
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [lobby]
      summary: Get queue or match status
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
  /rooms/{roomId}/leave:
    post:
      operationId: leaveRoom
      tags: [lobby]
      summary: Leave a waiting queue and refund its entry fee
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: Match already started
  /rooms/{roomId}/score:
    post:
      operationId: submitRoomScore
      tags: [lobby]
      summary: Submit a completed game score
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomScoreInput"
      responses:
        "200":
          description: Score recorded or room settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "409":
          description: Room is not accepting scores
  /wallet/deposits:
    post:
      operationId: createDeposit
      tags: [wallet]
      summary: Submit a manual deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Deposit request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid deposit request or amount limits not met
        "401":
          description: Sign in required
  /wallet/withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Submit a manual withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Amount limits or available balance not met
        "401":
          description: Sign in required
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get revenue streams, system settings, and pending requests
      responses:
        "200":
          description: Operations dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "403":
          description: Admin access required
  /admin/settings:
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Update the public deposit UPI details and QR image URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "403":
          description: Admin access required
  /admin/deposits/{transactionId}/decision:
    post:
      operationId: decideDeposit
      tags: [admin]
      summary: Approve or reject a pending deposit
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositDecisionInput"
      responses:
        "200":
          description: Deposit request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          description: Admin access required
        "404":
          description: Pending deposit not found
  /admin/withdrawals/{transactionId}/complete:
    post:
      operationId: completeWithdrawal
      tags: [admin]
      summary: Mark a pending withdrawal as manually paid
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Withdrawal marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          description: Admin access required
        "404":
          description: Pending withdrawal not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    Player:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [player, admin] }
    Wallet:
      type: object
      required: [totalMoney]
      properties:
        totalMoney: { type: number, minimum: 0 }
    SessionResponse:
      type: object
      required: [user, wallet]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/Player"
            - type: "null"
        wallet:
          oneOf:
            - $ref: "#/components/schemas/Wallet"
            - type: "null"
    SignUpInput:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 2, maxLength: 40 }
        password: { type: string, minLength: 10, maxLength: 128 }
    SignInInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    Game:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    RoomOption:
      type: object
      required: [id, title, playerCount, entryFee, prize, adminKeeps]
      properties:
        id: { type: string, enum: ["duo20", "duo50", "quad20", "quad50"] }
        title: { type: string }
        playerCount: { type: integer, enum: [2, 4] }
        entryFee: { type: number }
        prize: { type: number }
        adminKeeps: { type: number }
    RoomPlayer:
      type: object
      required: [userId, displayName, hasSubmittedScore]
      properties:
        userId: { type: string }
        displayName: { type: string }
        hasSubmittedScore: { type: boolean }
    Room:
      type: object
      required: [id, gameId, gameName, optionId, entryFee, playerCount, requiredSlots, prize, status, players, createdAt, userSubmittedScore]
      properties:
        id: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        optionId: { type: string, enum: ["duo20", "duo50", "quad20", "quad50"] }
        entryFee: { type: number }
        playerCount: { type: integer }
        requiredSlots: { type: integer }
        prize: { type: number }
        status: { type: string, enum: [waiting, active, finished] }
        winnerName: { type: ["string", "null"] }
        players:
          type: array
          items: { $ref: "#/components/schemas/RoomPlayer" }
        createdAt: { type: string, format: date-time }
        userSubmittedScore: { type: boolean }
    RoomJoinInput:
      type: object
      required: [gameId, optionId]
      properties:
        gameId: { type: string, enum: [snake, clicker, tic-tac-toe] }
        optionId: { type: string, enum: ["duo20", "duo50", "quad20", "quad50"] }
    RoomScoreInput:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 0, maximum: 100000 }
    Transaction:
      type: object
      required: [id, userId, userName, type, status, amount, tax, payout, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        type: { type: string, enum: [deposit, withdrawal] }
        status: { type: string, enum: [pending, approved, rejected, completed] }
        amount: { type: number }
        utr: { type: ["string", "null"] }
        upiId: { type: ["string", "null"] }
        screenshotDataUrl: { type: ["string", "null"] }
        tax: { type: number }
        payout: { type: number }
        createdAt: { type: string, format: date-time }
    DepositInput:
      type: object
      required: [amount, utr, screenshotDataUrl]
      properties:
        amount: { type: number, minimum: 50, maximum: 500, multipleOf: 0.01 }
        utr: { type: string, minLength: 6, maxLength: 64 }
        screenshotDataUrl: { type: string, maxLength: 3000000 }
    WithdrawalInput:
      type: object
      required: [amount, upiId]
      properties:
        amount: { type: number, minimum: 70, maximum: 1000, multipleOf: 0.01 }
        upiId: { type: string, minLength: 5, maxLength: 128 }
    DepositDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
    AdminSettings:
      type: object
      required: [adminUpiId, adminQrCodeUrl]
      properties:
        adminUpiId: { type: string }
        adminQrCodeUrl: { type: string }
    AdminSettingsInput:
      type: object
      required: [adminUpiId, adminQrCodeUrl]
      properties:
        adminUpiId: { type: string, minLength: 5, maxLength: 128 }
        adminQrCodeUrl: { type: string, minLength: 1, maxLength: 2048 }
    LobbyResponse:
      type: object
      required: [user, wallet, games, roomOptions, activeRoom, transactions, settings]
      properties:
        user: { $ref: "#/components/schemas/Player" }
        wallet: { $ref: "#/components/schemas/Wallet" }
        games:
          type: array
          items: { $ref: "#/components/schemas/Game" }
        roomOptions:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: "#/components/schemas/RoomOption" }
        activeRoom:
          oneOf:
            - $ref: "#/components/schemas/Room"
            - type: "null"
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        settings: { $ref: "#/components/schemas/AdminSettings" }
    AdminDashboard:
      type: object
      required: [rake20Player2, rake50Player2, rake20Player4, rake50Player4, totalWithdrawalTax, pendingCount, deposits, withdrawals, settings]
      properties:
        rake20Player2: { type: number }
        rake50Player2: { type: number }
        rake20Player4: { type: number }
        rake50Player4: { type: number }
        totalWithdrawalTax: { type: number }
        pendingCount: { type: integer }
        deposits:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        withdrawals:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        settings: { $ref: "#/components/schemas/AdminSettings" }
